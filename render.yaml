services:
  - type: web
    name: news-automation-backend
    runtime: node
    rootDir: .
    plan: starter
    buildCommand: npm run render:build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: TRUST_PROXY_ENABLED
        value: true
      - key: DB_DIALECT
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: require
      - key: BROWSER_EXECUTABLE_PATH
        value: ""
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.puppeteer-cache
      - key: SCHEDULER_ENABLED
        value: true
      - key: AI_SCHEDULER_ENABLED
        value: true
      - key: SCHEDULER_ARTICLES_PER_CATEGORY_RUN
        value: 5
      - key: SCHEDULER_PRIMARY_SOURCE_LIMIT
        value: 4
      - key: CLIFF_NEWS_DEFAULT_LIMIT
        value: 200
      - key: NEWS_MAX_AGE_HOURS
        value: 24
      - key: DASHBOARD_CACHE_TTL_SECONDS
        value: 10
      - key: FETCHED_NEWS_RETENTION_HOURS
        value: 24
      - key: AI_REWRITE_RETENTION_HOURS
        value: 24
      - key: AI_REWRITE_CANDIDATE_LIMIT
        value: 10
      - key: MPINFO_DISTRICT_SCHEDULER_ENABLED
        value: true
      - key: MPINFO_DISTRICT_BROWSER_ENABLED
        value: true
      - key: MPINFO_DISTRICT_CATEGORY
        value: Madhyapradesh
      - key: MPINFO_DISTRICT_SCHEDULER_INTERVAL_MS
        value: 2700000
      - key: MPINFO_DISTRICT_SCHEDULER_LIMIT
        value: 2
      - key: MPINFO_DISTRICT_SCHEDULER_SCAN_LIMIT
        value: 2
      - key: MPINFO_DISTRICT_SCHEDULER_REWRITE
        value: true
      - key: MPINFO_DISTRICT_SCHEDULER_STARTUP_RUN
        value: false
      - key: MPINFO_DISTRICT_CONCURRENCY
        value: 1
      - key: MPINFO_ARTICLE_CONCURRENCY
        value: 1
      - key: LEGACY_PUBLIC_ROUTES_ENABLED
        value: false
      - key: MASTER_API_KEY
        sync: false
      - key: API_CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_API_URL
        value: https://api.deepseek.com/chat/completions
