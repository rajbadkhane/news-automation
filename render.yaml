services:
  - type: web
    name: news-automation-backend
    runtime: node
    rootDir: .
    plan: starter
    buildCommand: npm run render:build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: TRUST_PROXY_ENABLED
        value: true
      - key: DB_DIALECT
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: require
      - key: BROWSER_EXECUTABLE_PATH
        value: ""
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.puppeteer-cache
      - key: SCHEDULER_ENABLED
        value: true
      - key: AI_SCHEDULER_ENABLED
        value: true
      - key: MPINFO_DISTRICT_SCHEDULER_ENABLED
        value: true
      - key: MPINFO_DISTRICT_BROWSER_ENABLED
        value: true
      - key: MPINFO_DISTRICT_SCHEDULER_INTERVAL_MS
        value: 1800000
      - key: MPINFO_DISTRICT_SCHEDULER_LIMIT
        value: 1
      - key: MPINFO_DISTRICT_SCHEDULER_SCAN_LIMIT
        value: 1
      - key: MPINFO_DISTRICT_SCHEDULER_REWRITE
        value: true
      - key: MPINFO_DISTRICT_CONCURRENCY
        value: 1
      - key: MPINFO_ARTICLE_CONCURRENCY
        value: 1
      - key: LEGACY_PUBLIC_ROUTES_ENABLED
        value: false
      - key: MASTER_API_KEY
        sync: false
      - key: API_CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
